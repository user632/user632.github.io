<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Faktura z tłem</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background: #ddd;
        display: flex;
        justify-content: center;
    }

    .invoice {
        position: relative;
        width: 1000px; /* możesz zmienić */
        aspect-ratio: 2970 / 2100; /* proporcje obrazu */
        background-image: url("fak2.jpg");
        background-size: cover;
        background-repeat: no-repeat;
    }

    input {
        position: absolute;
        border: 1px solid rgba(0,0,0,0.3);
        background: rgba(255,255,255,0.5);
        padding: 3px;
        font-size: 12px;
    }

    /* ---- Przykładowe pola — możesz dodać kolejne ---- */
    #nr_faktury { top: 4%; left: 32%; width: 22%; height: 3%; }
    #miejscowosc { top: 4%; left: 73%; width: 23%; height: 3%; }
    #data { top: 9%; left: 73%; width: 23%; height: 3%; }

    #sprzedawca_nazwa { top: 16%; left: 4%; width: 40%; height: 3%; }
    #sprzedawca_nip   { top: 20%; left: 4%; width: 40%; height: 3%; }

    #nabywca_nazwa { top: 16%; left: 55%; width: 40%; height: 3%; }
    #nabywca_nip   { top: 20%; left: 55%; width: 40%; height: 3%; }

    /* Wiersz tabeli */
    .item-nazwa { top: 34%; left: 5%; width: 38%; height: 3%; }
    .item-ilosc { top: 34%; left: 45%; width: 5%;  height: 3%; }
    .item-jm    { top: 34%; left: 51%; width: 5%; height: 3%; }
    .item-cena  { top: 34%; left: 58%; width: 9%; height: 3%; }
    .item-vat   { top: 34%; left: 72%; width: 4%; height: 3%; }
    .item-netto { top: 34%; left: 77%; width: 9%; height: 3%; }
    .item-brutto{ top: 34%; left: 88%; width: 9%; height: 3%; }

    #do_zaplaty { top: 63%; left: 22%; width: 33%; height: 4%; font-weight:bold; }
</style>
</head>
<body>

<div class="invoice">

    <input id="nr_faktury" placeholder="Nr faktury">
    <input id="miejscowosc" placeholder="Miejscowość">
    <input id="data" placeholder="Data wystawienia">

    <input id="sprzedawca_nazwa" placeholder="Sprzedawca – nazwa">
    <input id="sprzedawca_nip" placeholder="Sprzedawca – NIP">

    <input id="nabywca_nazwa" placeholder="Nabywca – nazwa">
    <input id="nabywca_nip" placeholder="Nabywca – NIP">

    <!-- Przykładowy pierwszy wiersz tabeli -->
    <input class="item-nazwa" placeholder="Towar/usługa">
    <input class="item-ilosc" placeholder="Ilość">
    <input class="item-jm" placeholder="J.m.">
    <input class="item-cena" placeholder="Cena netto">
    <input class="item-vat" placeholder="VAT %">
    <input class="item-netto" placeholder="Netto">
    <input class="item-brutto" placeholder="Brutto">

    <input id="do_zaplaty" placeholder="Do zapłaty">
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formularz </title>
  <style>
    body {
  
      background:rgb(241, 214, 220);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 40px;
    }

    form {
      background-color: #ffffff;
      padding: 30px 40px;


      width: 100%;
      max-width: 600px;
    }

    h2 {
      text-align: center;
      color: #000000;
      margin-bottom: 25px;
    }

    label {
      font-weight: 600;
      color: #000000;
      display: block;
      margin-top: 15px;
    }

    input[type="text"],
    input[type="date"],
    input[type="password"],
    input[type="email"],
    input[type="file"],
    input[type="tel"] {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #000000;
     
      box-sizing: border-box;
      transition: border-color 0.2s ease;
    }

    input[type="text"]:focus,
    input[type="date"]:focus,
    input[type="password"]:focus,
    input[type="email"]:focus,
    input[type="file"]:focus,
    input[type="tel"]:focus {
      border-color: #000000;
      outline: none;
    }

    p {
      margin-top: 20px;
      font-weight: 600;
      color: #000000;
    }

    .gender {
      display: flex;
      gap: 20px;
      margin-top: 5px;
    }

    .gender label {
      font-weight: 500;
      color: #000000;
    }

    input[type="submit"] {
      background-color: #313a2d;
      color: white;
      font-weight: bold;
      border: none;
    
      padding: 12px 20px;
      width: 100%;
      margin-top: 25px;


    }

    input[type="submit"]:hover {
      background-color: #30c902;
    }
  </style>
</head>
<body>

  <form action="https://nonsa.pl/wiki/Gra:Strona_87" method="post">
    <h2>Formularz</h2>

    <label for="imie">Imię:</label>
    <input type="text" id="imie" name="imie">

    <label for="nazw">Nazwisko:</label>
    <input type="text" id="nazw" name="nazw">

    <label for="ur">Data urodzenia:</label>
    <input type="date" id="ur" name="ur">

    <label for="pass">Hasło:</label>
    <input type="password" id="pass" name="pass">

    <label for="ul">Ulica:</label>
    <input type="text" id="ul" name="ul">

    <label for="M">Miasto:</label>
    <input type="text" id="M" name="M">

    <label for="mail">Email:</label>
    <input type="email" id="mail" name="mail">

    <label for="dokument">Prawo jazdy:</label>
    <input type="file" id="dokument" name="dokument">

    <p>Płeć:</p>
    <div class="gender">
      <label><input type="radio" id="man" name="sex" value="MALE"> Mężczyzna</label>
      <label><input type="radio" id="women" name="sex" value="FEMALE"> Kobieta</label>
    </div>

    <label for="uwagi">Uwagi:</label>
    <input type="text" id="uwagi" name="uwagi">

    <label for="nrtel">Numer telefonu:</label>
    <input type="tel" id="nrtel" name="nrtel">

    <label for="wojewodztwo">Województwo:</label>
    <input type="text" id="wojewodztwo" name="wojewodztwo">

    <input type="submit" value="Wyślij">
  </form>

</body>
</html>

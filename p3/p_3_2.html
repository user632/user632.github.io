<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria zdjęć</title>
  <style>
    body {
  
      
      margin: 0;
      padding: 4px;
       color: #ffffff;
    }

    h1 {
      text-align: center;
      color: #ff0000;
      margin-bottom: 3px;
    }

    .gallery {
      display: grid;
      grid-template-columns: 25% 25% 25% 25%;
      gap: 10px;
      max-width: 100%;
      margin: 0 auto;
    }

    .photo {
      background-color: #fff;
     
      overflow: hidden;

      text-align: center;
 
    }



    .photo img {
      width: 100%;
      height: auto;
      display: block;
    }

    .caption {
      padding: 10px 5px;
      font-size: 0.95rem;
      color: #444;
      background-color: #fafafa;
      border-top: 1px solid #eee;
    }

  
  </style>
</head>
<body>

  <h1>Galeria zdjęć</h1>

  <div class="gallery">
    <div class="photo">
      <img src="/p2/IMG_20191217_125009.jpg" alt="adolf">
      <div class="caption">adolf poszukiwany</div>
    </div>

    <div class="photo">
      <img src="/p2/IMG_20200421_190025.jpg" alt="lego 4x4">
      <div class="caption">lego 4x4 chassis</div>
    </div>

    <div class="photo">
      <img src="/p2/IMG_20201201_124041.jpg" alt="meme">
      <div class="caption">amerykański mem</div>
    </div>

    <div class="photo">
      <img src="/p2/IMG_20220619_133201.jpg" alt="alpy">
      <div class="caption">alpy 2022</div>
    </div>

    <div class="photo">
      <img src="/p2/IMG_20191123_165620.jpg" alt="przodek">
      <div class="caption">obraz przodka circa 1860</div>
    </div>

    <div class="photo">
      <img src="/p2/IMG_20191205_100426.jpg" alt="imperium">
      <div class="caption">imperium rekrutuje</div>
    </div>

    <div class="photo">
      <img src="/p2/IMG_20210222_143902.jpg" alt="igloo">
      <div class="caption">igloo</div>
    </div>

    <div class="photo">
      <img src="/p2/IMG_20220205_111124.jpg" alt="łoś">
      <div class="caption">łoś</div>
    </div>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria zdjęć</title>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #e0f7fa, #fce4ec);
      margin: 0;
      padding: 40px;
      color: #333;
    }

    h1 {
      text-align: center;
      color: #6a1b9a;
      margin-bottom: 30px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .photo {
      background-color: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .photo:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
    }

    .photo img {
      width: 100%;
      height: auto;
      display: block;
    }

    .caption {
      padding: 10px 5px;
      font-size: 0.95rem;
      color: #444;
      background-color: #fafafa;
      border-top: 1px solid #eee;
    }

    @media (max-width: 600px) {
      body {
        padding: 20px;
      }
      .caption {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

  <h1>Galeria zdjęć</h1>

  <div class="gallery">
    <div class="photo">
      <img src="/p2/IMG_20191217_125009.jpg" alt="adolf">
      <div class="caption">adolf poszukiwany</div>
    </div>

    <div class="photo">
      <img src="/p2/IMG_20200421_190025.jpg" alt="lego 4x4">
      <div class="caption">lego 4x4 chassis</div>
    </div>

    <div class="photo">
      <img src="/p2/IMG_20201201_124041.jpg" alt="meme">
      <div class="caption">amerykański mem</div>
    </div>

    <div class="photo">
      <img src="/p2/IMG_20220619_133201.jpg" alt="alpy">
      <div class="caption">alpy 2022</div>
    </div>

    <div class="photo">
      <img src="/p2/IMG_20191123_165620.jpg" alt="przodek">
      <div class="caption">obraz przodka circa 1860</div>
    </div>

    <div class="photo">
      <img src="/p2/IMG_20191205_100426.jpg" alt="imperium">
      <div class="caption">imperium rekrutuje</div>
    </div>

    <div class="photo">
      <img src="/p2/IMG_20210222_143902.jpg" alt="igloo">
      <div class="caption">igloo</div>
    </div>

    <div class="photo">
      <img src="/p2/IMG_20220205_111124.jpg" alt="łoś">
      <div class="caption">łoś</div>
    </div>
  </div>

</body>
</html>

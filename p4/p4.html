<!DOCTYPE html>
<html lang="en">
<meta charset="UTF-8">
<title>Page Title</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="">

<style>
.gigaf{
justify-content: center;
margin-left: 30%;
margin-right: 30%;
margin-top: 10%;
margin-bottom: 10%;
}
.but{
     display:  flex;
    background-color: aqua;
    border-radius: 25px;
    width: 100%;
    height: auto;
    justify-content: space-around;
    flex-direction: column;

}
.smal{

    background-color: rgb(227, 9, 111);
    border-radius: 25px;
    margin: 10px;
    width: 66px;
    height: 66px;
    padding: 20px;
    font-size: 30px;
   

}
.lines{display: flex;
margin: 10px;
color: rgb(194, 66, 66);
background-color: blueviolet;
flex-direction: row;
justify-content: space-around;
border-radius: 10px;



}
.num{
     display:  flex;
    background-color: rgb(40, 11, 206);
    border-radius: 10px;
    width: 80px;
    height: 80px;
    justify-content: center;
    font-size: 40px;

}
.out{width: 90%;
height: 60px ;
font-size: 66px;
background-color: white;
margin: 20px;
border-radius: 10px;
text-align: right;
align-self: center;

}
</style>
<script src=""></script>
<body>


<div class="gigaf">
    <div class="but">
        <div class="out" id="ou">test</div>
        <div class="lines">
     
            <button class=" smal">1</button>
            <button class=" smal">2</button>
            <button class=" smal">3</button>
            <button class=" smal">+</button>


        </div>
    <div class="lines">
         <button class="smal" onclick="ddd(c)">4</button>
        <button class="smal" onclick="ddd(5)">5s</button>
        <button class="smal">6</button>
        <button class="smal">-</button></div>
    <div class="lines">3</div>
    <div class="lines">+</div>
    </div>
</div>
<script>
function ddd(d) {
 let a=document.getElementById("ou").innerHTML;
 let st="";

 st=d;
 let l=st.length;
 let e=st[l-1];
if(e=="c"){document.getElementById("ou").innerHTML="";}else if(d==e){}else{document.getElementById("ou").innerHTML=a+d;}

  
}


</script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<meta charset="UTF-8">
<title>Page Title</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="">

<style>
.gigaf{
justify-content: center;
margin-left: 35%;
margin-right: 35%;
margin-top: 20%;
margin-bottom: 20%;
}
.but{
     display:  flex;
    background-color: aqua;
    border-radius: 25px;
    width: 100%;
    height: auto;
    justify-content: space-around;
    flex-direction: column;

}
.smal{

    background-color: rgb(227, 9, 111);
    border-radius: 25px;
    margin: 10px;
    width: 66px;
    height: 66px;
    padding: 20px;
    font-size: 30px;
   

}
.big{

    background-color: rgb(227, 9, 111);
    border-radius: 25px;
    margin: 10px;
    width: 200px;
    height: 66px;
    padding: 20px;
    font-size: 30px;
   

}
.lines{display: flex;
margin: 10px;
color: rgb(194, 66, 66);
background-color: aqua;
flex-direction: row;
justify-content: space-around;
border-radius: 10px;



}
.num{
     display:  flex;
    background-color: rgb(40, 11, 206);
    border-radius: 10px;
    width: 80px;
    height: 80px;
    justify-content: center;
    font-size: 40px;

}
.out{width: 90%;
height: 60px ;
font-size: 66px;
background-color: white;
margin: 20px;
border-radius: 10px;
text-align: right;
align-self: center;

}
</style>

<body>


<div class="gigaf">
    <div class="but">
        <div class="out" id="ou"></div>
        <div class="lines">
        <button class="smal" onclick="ddd(1)">1</button>
        <button class="smal" onclick="ddd(2)">2</button>
        <button class="smal" onclick="ddd(3)">3</button>
        <button class="smal" onclick="ddd('+')">+</button></div>




    <div class="lines">
         <button class="smal" onclick="ddd(4)">4</button>
        <button class="smal" onclick="ddd(5)">5</button>
        <button class="smal" onclick="ddd(6)">6</button>
        <button class="smal" onclick="ddd('-')">-</button></div>
    <div class="lines">
          <button class="smal" onclick="ddd(7)">7</button>
        <button class="smal" onclick="ddd(8)">8</button>
        <button class="smal" onclick="ddd(9)">9</button>
        <button class="smal" onclick="ddd('*')">*</button>


    </div>
    <div class="lines">
          <button class="smal" onclick="ddd('.')">.</button>
        <button class="smal" onclick="ddd(0)">0</button>
        <button class="smal" onclick="ddd('=')">=</button>
        <button class="smal" onclick="ddd('/')">/</button>

        
    </div>
    <div class="lines"> 
     <button class="big" onclick="ddd('c')">c</button>
     <button class="big" onclick="ddd('!')">backspace</button></div>
    </div>
</div>
<script>
    let coma=0;
    let number=0;
function ddd(d) {
 let a=document.getElementById("ou").innerHTML;
 let st="";

 st=a;
 let l=st.length;
 let e=st[l-1];
if(d=='c'){document.getElementById("ou").innerHTML="";}
else if(d=='.'){if(coma==0){document.getElementById("ou").innerHTML=a+d;coma=1;}else{}

}else if((d=='+'||d=='-'||d=='*'||d=='/')&&(e=='+'||e=='-'||e=='*'||e=='/')){
    //document.getElementById("ou").innerHTML="ffff"
}else if(d=='!'){
st=st.substring(0,l-1);
document.getElementById("ou").innerHTML=st;
}else if(d=='='){document.getElementById("ou").innerHTML=eval(a);}else
{document.getElementById("ou").innerHTML=a+d;}

  
}


</script>
</body>

</html>
